name: Release

# Builds a signed release APK, publishes it with a SHA-256 checksum as a GitHub Release.
# The in-app updater only accepts releases that contain BOTH files:
#   OpenPulse-vX.Y.Z.apk  and  OpenPulse-vX.Y.Z.apk.sha256
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias inside the keystore
#   ANDROID_KEY_PASSWORD      key password
# See docs/RELEASE_SIGNING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.0 (a tag v1.2.0 is created)"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "push" ]; then V="${REF_NAME#v}"; else V="${INPUT_VERSION#v}"; fi
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$V' is not a valid version (MAJOR.MINOR.PATCH, minor/patch < 100)"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if echo "$V" | grep -q -- '-'; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Check signing secrets are configured
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for n in KS KS_PASS ALIAS KEY_PASS; do
            if [ -z "${!n}" ]; then echo "::error::Signing secret for $n is missing"; missing=1; fi
          done
          exit $missing

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$KS" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "OPENPULSE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build signed release
        env:
          OPENPULSE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OPENPULSE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OPENPULSE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./gradlew --no-daemon --stacktrace :core:test :app:testDebugUnitTest :app:assembleRelease "-Popenpulse.versionName=$VERSION"

      - name: Verify signature and create checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::Signed APK not found (signing misconfigured?)"; exit 1; }
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p dist
          NAME="OpenPulse-v$VERSION.apk"
          cp "$APK" "dist/$NAME"
          (cd dist && sha256sum "$NAME" > "$NAME.sha256" && cat "$NAME.sha256")

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Open Pulse v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/OpenPulse-v${{ steps.version.outputs.version }}.apk
            dist/OpenPulse-v${{ steps.version.outputs.version }}.apk.sha256
