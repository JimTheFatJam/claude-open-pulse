name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core + app)
        run: ./gradlew --no-daemon --stacktrace :core:test :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      # No signing secrets here: produces an unsigned release APK, validating R8/minification.
      - name: Assemble release APK (unsigned, R8 check)
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: UI screenshots (Robolectric)
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testDebugUnitTest -Popenpulse.screenshots=true --tests 'app.openpulse.ScreenshotTest'

      # Compact copies in the log so screenshots can be inspected without artifact access.
      - name: Print screenshots (base64 JPEG)
        if: always()
        continue-on-error: true
        run: |
          shopt -s nullglob
          for f in app/build/screenshots/*.png; do
            n=$(basename "$f" .png)
            convert "$f" -resize 50% -quality 60 "/tmp/$n.jpg"
            echo "=====BEGIN $n====="
            base64 -w 4000 "/tmp/$n.jpg"
            echo "=====END $n====="
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: open-pulse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
